[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ainstein-navigator"
version = "2.0.0"
description = "Deterministic Socratic Solution DAG Navigator for Ainstein Math"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ainstein Team" }
]
keywords = ["dag", "education", "socratic", "math", "navigator", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ainstein-navigator = "navigator.cli:main"

[tool.setuptools]
packages = ["navigator"]

[tool.setuptools.package-dir]
"navigator" = "."