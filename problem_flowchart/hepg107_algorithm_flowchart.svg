<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .title { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .tag { font-size: 11px; font-weight: 600; fill: #38bdf8; }
      .box { rx: 10px; ry: 10px; stroke-width: 2px; }
      .line { stroke: #38bdf8; stroke-width: 2px; marker-end: url(#arrow); }
      .line-green { stroke: #34d399; stroke-width: 2px; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="630" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Pipeline Header -->
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="800" fill="#f1f5f9" letter-spacing="1">PROPORTIONAL SOLVER (PS) ALGORITHM PIPELINE</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#64748b">NCERT Class 8 Mathematics • Chapter 7: Proportional Reasoning - 1</text>

  <!-- Step 1: EXTRACT -->
  <rect x="230" y="65" width="500" height="52" class="box" fill="#1e293b" stroke="#818cf8"/>
  <text x="480" y="88" text-anchor="middle" class="title">📋 STEP 1: EXTRACT</text>
  <text x="480" y="106" text-anchor="middle" class="sub">Extract entities, numerical values, and associated units from problem text</text>
  <line x1="480" y1="117" x2="480" y2="137" class="line"/>

  <!-- Step 2: OBJECTIVE -->
  <rect x="230" y="140" width="500" height="52" class="box" fill="#1e293b" stroke="#818cf8"/>
  <text x="480" y="163" text-anchor="middle" class="title">🎯 STEP 2: OBJECTIVE</text>
  <text x="480" y="181" text-anchor="middle" class="sub">Define target unknown &amp; classify problem archetype (Type 1 to Type 4)</text>
  <line x1="480" y1="192" x2="480" y2="212" class="line"/>

  <!-- Step 3: Unit Normalization -->
  <rect x="230" y="215" width="500" height="52" class="box" fill="#1e293b" stroke="#38bdf8"/>
  <text x="480" y="238" text-anchor="middle" class="title">⚖️ STEP 3: Unit Normalization (If Required)</text>
  <text x="480" y="256" text-anchor="middle" class="sub">Standardize matching dimensions to common units (hr→min, kg→g, acre→sq ft)</text>
  <line x1="480" y1="267" x2="480" y2="295" class="line"/>

  <!-- Step 4: Modular SOLVE Container -->
  <rect x="30" y="295" width="900" height="155" rx="14" fill="#0b1329" stroke="#3b82f6" stroke-dasharray="6,4" stroke-width="2"/>
  <text x="50" y="320" font-size="13" font-weight="700" fill="#60a5fa">🧮 STEP 4: MODULAR SOLVE FUNCTION — solve(type, normalized_data)</text>

  <!-- Type 1 Box -->
  <rect x="50" y="335" width="195" height="98" class="box" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="147" y="358" text-anchor="middle" class="title">solve_type_1()</text>
  <text x="147" y="377" text-anchor="middle" class="sub">Simplest Form &amp; Ratio Equality</text>
  <text x="147" y="396" text-anchor="middle" class="tag">a · d = b · c</text>
  <text x="147" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">HCF / GCD Reduction</text>

  <!-- Type 2 Box -->
  <rect x="270" y="335" width="195" height="98" class="box" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="367" y="358" text-anchor="middle" class="title">solve_type_2()</text>
  <text x="367" y="377" text-anchor="middle" class="sub">Rule of Three (Trairāśika)</text>
  <text x="367" y="396" text-anchor="middle" class="tag">x = (b · c) / a</text>
  <text x="367" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">Proportional Scaling</text>

  <!-- Type 3 Box -->
  <rect x="490" y="335" width="195" height="98" class="box" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="587" y="358" text-anchor="middle" class="title">solve_type_3()</text>
  <text x="587" y="377" text-anchor="middle" class="sub">Sharing in a Ratio</text>
  <text x="587" y="396" text-anchor="middle" class="tag">u = T / (m + n)</text>
  <text x="587" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">S1 = m·u, S2 = n·u</text>

  <!-- Type 4 Box -->
  <rect x="710" y="335" width="200" height="98" class="box" fill="#1e1b4b" stroke="#818cf8"/>
  <text x="810" y="358" text-anchor="middle" class="title">solve_type_4()</text>
  <text x="810" y="377" text-anchor="middle" class="sub">Unit Rate &amp; Comparison</text>
  <text x="810" y="396" text-anchor="middle" class="tag">R1 = b1/a1 vs R2 = b2/a2</text>
  <text x="810" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">Density / Rate Ratio</text>

  <!-- Downward Line from SOLVE Container to Step 5 -->
  <line x1="480" y1="450" x2="480" y2="475" class="line-green"/>

  <!-- Step 5: Post-Processing -->
  <rect x="210" y="475" width="540" height="52" class="box" fill="#064e3b" stroke="#34d399"/>
  <text x="480" y="498" text-anchor="middle" class="title">🎯 STEP 5: Post-Processing &amp; Target Formatting</text>
  <text x="480" y="516" text-anchor="middle" class="sub">Attach target units, apply discrete ceiling ⌈x⌉, &amp; compute deltas</text>
  <line x1="480" y1="527" x2="480" y2="550" class="line-green"/>

  <!-- Step 6: Final Output -->
  <rect x="290" y="550" width="380" height="48" class="box" fill="#14532d" stroke="#4ade80"/>
  <text x="480" y="572" text-anchor="middle" font-size="14" font-weight="700" fill="#f0fdf4">🏁 Verified Numerical Result &amp; Units</text>
  <text x="480" y="588" text-anchor="middle" font-size="11" fill="#86efac">Exact closed-form mathematical output</text>
</svg>
