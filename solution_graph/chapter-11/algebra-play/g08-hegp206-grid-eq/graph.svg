<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Solution Graph: Grid Intersection Points</text>

  <!-- ═══ START NODE ═══ -->
  <rect x="280" y="60" width="240" height="50" rx="8" fill="#4CAF50"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">START</text>
  <text x="400" y="102" text-anchor="middle" font-size="11" fill="white">Lines: 2x + 3y = 12 and 4x + 3y = 24</text>

  <!-- ═══ EXTRACTION NODES ═══ -->
  <rect x="280" y="140" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Extract Given Information</text>
  <text x="400" y="182" text-anchor="middle" font-size="10" fill="white">What are the two equations? [optional]</text>

  <rect x="280" y="210" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Identify the Goal</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="white">Find intersection point (x,y) [optional]</text>

  <!-- ═══ METHOD 1 NODE ═══ -->
  <rect x="50" y="300" width="300" height="50" rx="8" fill="#2196F3"/>
  <text x="200" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Method 1: Elimination Method</text>
  <text x="200" y="342" text-anchor="middle" font-size="10" fill="white">Subtract equations to eliminate y</text>

  <!-- ═══ M1 STEP 1 ═══ -->
  <rect x="50" y="380" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 1: Subtract Equations</text>
  <text x="200" y="422" text-anchor="middle" font-size="10" fill="white">(4x+3y) - (2x+3y) = 24 - 12</text>

  <!-- ═══ M1 STEP 2 ═══ -->
  <rect x="50" y="460" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 2: Solve for x</text>
  <text x="200" y="502" text-anchor="middle" font-size="10" fill="white">2x = 12, therefore x = ?</text>

  <!-- ═══ M1 STEP 3 ═══ -->
  <rect x="50" y="540" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3: Substitute to Find y</text>
  <text x="200" y="582" text-anchor="middle" font-size="10" fill="white">Substitute x = 6 into first equation</text>

  <!-- ═══ CONCLUSION NODE ═══ -->
  <rect x="280" y="640" width="240" height="50" rx="8" fill="#9C27B0"/>
  <text x="400" y="665" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CONCLUSION</text>
  <text x="400" y="682" text-anchor="middle" font-size="11" fill="white">Intersection: (6, 0)</text>

  <!-- ═══ CONNECTIONS ═══ -->
  <!-- Start to extractions -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="400" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extractions to method -->
  <line x1="400" y1="190" x2="200" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="190" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Method 1 steps -->
  <line x1="200" y1="350" x2="200" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="430" x2="200" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="510" x2="200" y2="540" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Steps to conclusion -->
  <line x1="200" y1="590" x2="400" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="710" width="18" height="18" fill="#4CAF50" rx="2"/>
  <text x="42" y="725" font-size="10" fill="#555">Start</text>
  <rect x="20" y="715" width="18" height="18" fill="#2196F3" rx="2"/>
  <text x="42" y="730" font-size="10" fill="#555">Method</text>
  <rect x="20" y="730" width="18" height="18" fill="#FF9800" rx="2"/>
  <text x="42" y="745" font-size="10" fill="#555">Step/Extraction</text>
  <rect x="20" y="745" width="18" height="18" fill="#9C27B0" rx="2"/>
  <text x="42" y="760" font-size="10" fill="#555">Conclusion</text>
</svg>