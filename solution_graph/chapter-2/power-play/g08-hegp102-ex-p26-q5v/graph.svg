<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Solution Graph: Simplify m⁵n¹²/(mn)⁹</text>

  <!-- ═══ START NODE ═══ -->
  <rect x="280" y="60" width="240" height="50" rx="8" fill="#4CAF50"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">START</text>
  <text x="400" y="102" text-anchor="middle" font-size="11" fill="white">Simplify m⁵n¹²/(mn)⁹</text>

  <!-- ═══ EXTRACTION NODE ═══ -->
  <rect x="280" y="140" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Identify the Expression</text>
  <text x="400" y="182" text-anchor="middle" font-size="10" fill="white">What is (mn)⁹ simplified? [optional]</text>

  <!-- ═══ METHOD 1 NODE ═══ -->
  <rect x="50" y="240" width="300" height="50" rx="8" fill="#2196F3"/>
  <text x="200" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Method 1: Quotient Rule</text>
  <text x="200" y="282" text-anchor="middle" font-size="10" fill="white">Apply aᵐ/aⁿ = aᵐ⁻ⁿ for m and n</text>

  <!-- ═══ M1 STEP 1 ═══ -->
  <rect x="50" y="310" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 1: Simplify m Terms</text>
  <text x="200" y="352" text-anchor="middle" font-size="10" fill="white">What is m⁵/m⁹ simplified?</text>

  <!-- ═══ M1 STEP 2 ═══ -->
  <rect x="50" y="380" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 2: Simplify n Terms</text>
  <text x="200" y="422" text-anchor="middle" font-size="10" fill="white">What is n¹²/n⁹ simplified?</text>

  <!-- ═══ M1 STEP 3 ═══ -->
  <rect x="50" y="450" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3: Combine Results</text>
  <text x="200" y="492" text-anchor="middle" font-size="10" fill="white">Combine m⁻⁴ and n³</text>

  <!-- ═══ CONCLUSION NODE ═══ -->
  <rect x="280" y="540" width="240" height="50" rx="8" fill="#9C27B0"/>
  <text x="400" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CONCLUSION</text>
  <text x="400" y="582" text-anchor="middle" font-size="11" fill="white">The simplified form is n³/m⁴</text>

  <!-- ═══ CONNECTIONS ═══ -->
  <!-- Start to extraction -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extraction to method -->
  <line x1="400" y1="190" x2="200" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Direct leap from start to method -->
  <line x1="340" y1="110" x2="200" y2="240" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Method 1 steps -->
  <line x1="200" y1="290" x2="200" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="360" x2="200" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="430" x2="200" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Steps to conclusion -->
  <line x1="200" y1="500" x2="400" y2="540" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="600" width="18" height="18" fill="#4CAF50" rx="2"/>
  <text x="42" y="615" font-size="10" fill="#555">Start</text>
  <rect x="20" y="625" width="18" height="18" fill="#2196F3" rx="2"/>
  <text x="42" y="640" font-size="10" fill="#555">Method</text>
  <rect x="20" y="650" width="18" height="18" fill="#FF9800" rx="2"/>
  <text x="42" y="665" font-size="10" fill="#555">Step/Extraction</text>
  <rect x="20" y="675" width="18" height="18" fill="#9C27B0" rx="2"/>
  <text x="42" y="690" font-size="10" fill="#555">Conclusion</text>
</svg>