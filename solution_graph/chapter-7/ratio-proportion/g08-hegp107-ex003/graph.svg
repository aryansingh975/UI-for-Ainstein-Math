<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style>
      .title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .method { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .step { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .detail { font: 12px 'Segoe UI', Arial, sans-serif; fill: #a5b4c8; }
      .box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 10; }
      .green { fill: #052e2b; stroke: #34d399; stroke-width: 2; rx: 10; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .success { stroke: #34d399; stroke-width: 2.2; fill: none; marker-end: url(#arrowgreen); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#0b1120"/>
  <text x="640" y="42" text-anchor="middle" class="title">SOLUTION GRAPH - g08-hegp107-ex003</text>
  <text x="640" y="70" text-anchor="middle" class="subtitle">Nitin and Hari's compound wall question</text>

  <rect x="500" y="90" width="280" height="48" class="box"/>
  <text x="640" y="120" text-anchor="middle" class="method">START</text>

  <rect x="40" y="170" width="240" height="52" class="box"/>
  <text x="160" y="201" text-anchor="middle" class="method">M1 Simplify</text>
  <rect x="50" y="236" width="220" height="52" class="box"/>
  <text x="160" y="267" text-anchor="middle" class="step">60:3 → 20:1</text>
  <rect x="50" y="302" width="220" height="52" class="box"/>
  <text x="160" y="333" text-anchor="middle" class="step">40:2 → 20:1</text>
  <path d="M160 354 L160 390" class="arrow"/>
  <rect x="50" y="390" width="220" height="52" class="green"/>
  <text x="160" y="421" text-anchor="middle" class="step">20:1 = 20:1</text>
  <path d="M260 198 L500 198" class="arrow"/>

  <rect x="360" y="170" width="240" height="52" class="box"/>
  <text x="480" y="201" text-anchor="middle" class="method">M2 Fraction</text>
  <rect x="370" y="236" width="220" height="52" class="box"/>
  <text x="480" y="267" text-anchor="middle" class="step">60/3 and 40/2</text>
  <rect x="370" y="302" width="220" height="52" class="box"/>
  <text x="480" y="333" text-anchor="middle" class="step">20 and 20</text>
  <path d="M480 354 L480 390" class="arrow"/>
  <rect x="370" y="390" width="220" height="52" class="green"/>
  <text x="480" y="421" text-anchor="middle" class="step">Equal values</text>
  <path d="M600 198 L780 198" class="arrow"/>

  <rect x="680" y="170" width="240" height="52" class="box"/>
  <text x="800" y="201" text-anchor="middle" class="method">M3 Scaling</text>
  <rect x="690" y="236" width="220" height="52" class="box"/>
  <text x="800" y="267" text-anchor="middle" class="step">60/3 = 20</text>
  <rect x="690" y="302" width="220" height="52" class="box"/>
  <text x="800" y="333" text-anchor="middle" class="step">40/2 = 20</text>
  <path d="M800 354 L800 390" class="arrow"/>
  <rect x="690" y="390" width="220" height="52" class="green"/>
  <text x="800" y="421" text-anchor="middle" class="step">Same factor</text>
  <path d="M920 198 L1060 198" class="arrow"/>

  <rect x="1000" y="170" width="240" height="52" class="box"/>
  <text x="1120" y="201" text-anchor="middle" class="method">M4 Cross</text>
  <rect x="1010" y="236" width="220" height="52" class="box"/>
  <text x="1120" y="267" text-anchor="middle" class="step">60×2 and 40×3</text>
  <rect x="1010" y="302" width="220" height="52" class="box"/>
  <text x="1120" y="333" text-anchor="middle" class="step">120 and 120</text>
  <path d="M1120 354 L1120 390" class="arrow"/>
  <rect x="1010" y="390" width="220" height="52" class="green"/>
  <text x="1120" y="421" text-anchor="middle" class="step">Equal products</text>

  <path d="M640 138 L640 170" class="arrow"/>
  <path d="M160 454 L160 562 L1120 562 L1120 442" class="success"/>
  <rect x="470" y="560" width="340" height="72" class="green"/>
  <text x="640" y="590" text-anchor="middle" class="method">CONCLUSION</text>
  <text x="640" y="611" text-anchor="middle" class="detail">No — both ratios are proportional</text>
</svg>
