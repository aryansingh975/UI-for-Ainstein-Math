<svg xmlns="http://www.w3.org/2000/svg" width="800" height="850" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Solution Graph: School Provisions</text>

  <!-- ═══ START NODE ═══ -->
  <rect x="280" y="60" width="240" height="50" rx="8" fill="#4CAF50"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">START</text>
  <text x="400" y="102" text-anchor="middle" font-size="11" fill="white">Provisions for 80 students, 15 days</text>

  <!-- ═══ EXTRACTION NODES ═══ -->
  <rect x="280" y="140" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Identify the Givens</text>
  <text x="400" y="182" text-anchor="middle" font-size="10" fill="white">What information is given? [optional]</text>

  <rect x="280" y="210" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Identify the Goal</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="white">What do we need to find? [optional]</text>

  <!-- ═══ METHOD 1 NODE ═══ -->
  <rect x="50" y="300" width="300" height="50" rx="8" fill="#2196F3"/>
  <text x="200" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Method 1: Total Provisions Method</text>
  <text x="200" y="342" text-anchor="middle" font-size="10" fill="white">Calculate total, then divide by new count</text>

  <!-- ═══ M1 STEP 1 ═══ -->
  <rect x="50" y="380" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 1: Calculate Total Provisions</text>
  <text x="200" y="422" text-anchor="middle" font-size="10" fill="white">What is 80 × 15?</text>

  <!-- ═══ M1 STEP 2 ═══ -->
  <rect x="50" y="460" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 2: Find New Total Students</text>
  <text x="200" y="502" text-anchor="middle" font-size="10" fill="white">How many students after 20 more join?</text>

  <!-- ═══ M1 STEP 3 ═══ -->
  <rect x="50" y="540" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3: Divide to Find New Days</text>
  <text x="200" y="582" text-anchor="middle" font-size="10" fill="white">Divide total by new student count</text>

  <!-- ═══ METHOD 2 NODE ═══ -->
  <rect x="450" y="300" width="300" height="50" rx="8" fill="#2196F3"/>
  <text x="600" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Method 2: Inverse Proportion Equation</text>
  <text x="600" y="342" text-anchor="middle" font-size="10" fill="white">Set up: students₁ × days₁ = students₂ × days₂</text>

  <!-- ═══ M2 STEP 1 ═══ -->
  <rect x="450" y="380" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="600" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 1: Substitute and Simplify</text>
  <text x="600" y="422" text-anchor="middle" font-size="10" fill="white">Substitute values into equation</text>

  <!-- ═══ M2 STEP 2 ═══ -->
  <rect x="450" y="460" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="600" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 2: Solve for d</text>
  <text x="600" y="502" text-anchor="middle" font-size="10" fill="white">Solve 100d = 1200</text>

  <!-- ═══ CONCLUSION NODE ═══ -->
  <rect x="280" y="640" width="240" height="50" rx="8" fill="#9C27B0"/>
  <text x="400" y="665" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CONCLUSION</text>
  <text x="400" y="682" text-anchor="middle" font-size="11" fill="white">Provisions last 12 days</text>

  <!-- ═══ CONNECTIONS ═══ -->
  <!-- Start to extractions -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="400" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extractions to methods -->
  <line x1="400" y1="190" x2="200" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="190" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="200" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Direct leaps from start to methods -->
  <line x1="340" y1="110" x2="200" y2="300" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="460" y1="110" x2="600" y2="300" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Method 1 steps -->
  <line x1="200" y1="350" x2="200" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="430" x2="200" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="510" x2="200" y2="540" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Method 2 steps -->
  <line x1="600" y1="350" x2="600" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="430" x2="600" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="480" x2="600" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Steps to conclusion -->
  <line x1="200" y1="590" x2="340" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="520" x2="460" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="750" width="18" height="18" fill="#4CAF50" rx="2"/>
  <text x="42" y="765" font-size="10" fill="#555">Start</text>
  <rect x="20" y="765" width="18" height="18" fill="#2196F3" rx="2"/>
  <text x="42" y="780" font-size="10" fill="#555">Method</text>
  <rect x="20" y="780" width="18" height="18" fill="#FF9800" rx="2"/>
  <text x="42" y="795" font-size="10" fill="#555">Step/Extraction</text>
  <rect x="20" y="795" width="18" height="18" fill="#9C27B0" rx="2"/>
  <text x="42" y="810" font-size="10" fill="#555">Conclusion</text>
</svg>