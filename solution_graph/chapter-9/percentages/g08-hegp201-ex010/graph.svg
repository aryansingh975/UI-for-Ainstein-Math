<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Solution Graph: Discount and Profit%</text>

  <!-- ═══ START NODE ═══ -->
  <rect x="280" y="60" width="240" height="50" rx="8" fill="#4CAF50"/>
  <text x="400" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="white">START</text>
  <text x="400" y="102" text-anchor="middle" font-size="11" fill="white">Marked Price = ₹800, Discount = 10%</text>

  <!-- ═══ EXTRACTION NODES ═══ -->
  <rect x="280" y="140" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Extract Given Information</text>
  <text x="400" y="182" text-anchor="middle" font-size="10" fill="white">What is MP and discount%? [optional]</text>

  <rect x="280" y="210" width="240" height="50" rx="8" fill="#FF9800"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Identify the Goal</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="white">Find profit% when no discount [optional]</text>

  <!-- ═══ METHOD 1 NODE ═══ -->
  <rect x="50" y="300" width="300" height="50" rx="8" fill="#2196F3"/>
  <text x="200" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Method 1: Find SP then Profit%</text>
  <text x="200" y="342" text-anchor="middle" font-size="10" fill="white">SP = MP - Discount, then find CP, then profit%</text>

  <!-- ═══ STEP 1: DISCOUNT AMOUNT ═══ -->
  <rect x="50" y="380" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Calculate Discount Amount</text>
  <text x="200" y="422" text-anchor="middle" font-size="10" fill="white">Discount = 10% of MP = 0.1 × 800 = ?</text>

  <!-- ═══ STEP 2: SELLING PRICE ═══ -->
  <rect x="50" y="460" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Calculate Selling Price</text>
  <text x="200" y="502" text-anchor="middle" font-size="10" fill="white">SP = MP - Discount = 800 - ?</text>

  <!-- ═══ STEP 3: COST PRICE ═══ -->
  <rect x="50" y="540" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="565" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Find Cost Price</text>
  <text x="200" y="582" text-anchor="middle" font-size="10" fill="white">Profit = 20% of CP, so SP = 1.2 × CP</text>

  <!-- ═══ STEP 4: NEW SP WITHOUT DISCOUNT ═══ -->
  <rect x="50" y="620" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="645" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SP without Discount</text>
  <text x="200" y="662" text-anchor="middle" font-size="10" fill="white">SP = MP = ₹800 (no discount)</text>

  <!-- ═══ STEP 5: NEW PROFIT% ═══ -->
  <rect x="50" y="700" width="300" height="50" rx="8" fill="#FF9800"/>
  <text x="200" y="725" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Calculate New Profit Percentage</text>
  <text x="200" y="742" text-anchor="middle" font-size="10" fill="white">Profit% = ((SP - CP) / CP) × 100</text>

  <!-- ═══ CONCLUSION NODE ═══ -->
  <rect x="280" y="800" width="240" height="50" rx="8" fill="#9C27B0"/>
  <text x="400" y="825" text-anchor="middle" font-size="12" font-weight="bold" fill="white">CONCLUSION</text>
  <text x="400" y="842" text-anchor="middle" font-size="11" fill="white">Profit% = 50%</text>

  <!-- ═══ CONNECTIONS ═══ -->
  <!-- Start to extractions -->
  <line x1="400" y1="110" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="400" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extractions to method -->
  <line x1="400" y1="190" x2="200" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="190" x2="600" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Method 1 steps -->
  <line x1="200" y1="350" x2="200" y2="380" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="430" x2="200" y2="460" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="510" x2="200" y2="540" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="590" x2="200" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="670" x2="200" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Steps to conclusion -->
  <line x1="200" y1="750" x2="400" y2="800" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="880" width="18" height="18" fill="#4CAF50" rx="2"/>
  <text x="42" y="895" font-size="10" fill="#555">Start</text>
  <rect x="20" y="885" width="18" height="18" fill="#2196F3" rx="2"/>
  <text x="42" y="900" font-size="10" fill="#555">Method</text>
  <rect x="20" y="900" width="18" height="18" fill="#FF9800" rx="2"/>
  <text x="42" y="915" font-size="10" fill="#555">Step/Extraction</text>
  <rect x="20" y="915" width="18" height="18" fill="#9C27B0" rx="2"/>
  <text x="42" y="930" font-size="10" fill="#555">Conclusion</text>
</svg>