<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #f1f5f9; }
      .subtitle { font-size: 13px; fill: #94a3b8; }
      .method { font-size: 15px; font-weight: 700; fill: #e2e8f0; }
      .step { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
      .detail { font-size: 11px; fill: #aab6c5; }
      .connector { fill: none; stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrow); }
      .success { fill: none; stroke: #34d399; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .method-box { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.5; rx: 8; }
      .step-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.2; rx: 7; }
      .shared-box { fill: #123b36; stroke: #34d399; stroke-width: 2; rx: 10; }
      .conclusion-box { fill: #064e3b; stroke: #34d399; stroke-width: 2.5; rx: 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="1280" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="800" y="38" text-anchor="middle" class="title">SOLUTION GRAPH — g08-hegp107-ex001</text>
  <text x="800" y="62" text-anchor="middle" class="subtitle">Are the ratios 3 : 4 and 72 : 96 proportional?</text>

  <rect x="600" y="78" width="400" height="66" class="method-box"/>
  <text x="800" y="105" text-anchor="middle" class="method">START</text>
  <text x="800" y="126" text-anchor="middle" class="detail">Choose a valid method</text>

  <path d="M800 144 V160 H210 M800 160 H1560" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M210 160 V190 M590 160 V190 M970 160 V190 M1390 160 V190" class="connector"/>
  <path d="M1560 160 V744 H210 M1560 744 H590 M1560 744 H970 M1560 744 H1390" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M210 744 V770 M590 744 V770 M970 744 V770 M1390 744 V770" class="connector"/>

  <!-- Shared-comparison methods, ordered M1-M4 -->
  <rect x="40" y="190" width="340" height="50" class="method-box"/>
  <text x="210" y="221" text-anchor="middle" class="method">M1 · Simplification (HCF)</text>
  <rect x="55" y="265" width="310" height="45" class="step-box"/>
  <text x="210" y="284" text-anchor="middle" class="step">Find HCF: 24</text>
  <text x="210" y="300" text-anchor="middle" class="detail">HCF of 72 and 96</text>
  <path d="M210 310 V325" class="connector"/>
  <rect x="55" y="325" width="310" height="45" class="step-box"/>
  <text x="210" y="344" text-anchor="middle" class="step">Divide both terms by 24</text>
  <text x="210" y="360" text-anchor="middle" class="detail">72:96 becomes 3:4</text>
  <path d="M210 370 V385" class="connector"/>
  <rect x="55" y="385" width="310" height="45" class="step-box"/>
  <text x="210" y="413" text-anchor="middle" class="step">Reduced ratio: 3:4</text>
  <path d="M210 430 C275 470 400 500 500 530" class="success"/>

  <rect x="420" y="190" width="340" height="50" class="method-box"/>
  <text x="590" y="221" text-anchor="middle" class="method">M2 · Fraction Simplification</text>
  <rect x="435" y="265" width="310" height="45" class="step-box"/>
  <text x="590" y="293" text-anchor="middle" class="step">Write 72:96 as 72/96</text>
  <path d="M590 310 V325" class="connector"/>
  <rect x="435" y="325" width="310" height="45" class="step-box"/>
  <text x="590" y="353" text-anchor="middle" class="step">Simplify to 3/4</text>
  <path d="M590 370 C620 425 680 470 730 500" class="success"/>

  <rect x="800" y="190" width="340" height="50" class="method-box"/>
  <text x="970" y="221" text-anchor="middle" class="method">M3 · Prime Factorization</text>
  <rect x="815" y="265" width="145" height="48" class="step-box"/>
  <text x="887" y="285" text-anchor="middle" class="step">Factorize 72</text>
  <text x="887" y="301" text-anchor="middle" class="detail">2^3 × 3^2</text>
  <rect x="980" y="265" width="145" height="48" class="step-box"/>
  <text x="1052" y="285" text-anchor="middle" class="step">Factorize 96</text>
  <text x="1052" y="301" text-anchor="middle" class="detail">2^5 × 3</text>
  <path d="M887 313 L970 330 M1052 313 L970 330" class="connector"/>
  <rect x="815" y="330" width="310" height="45" class="step-box"/>
  <text x="970" y="358" text-anchor="middle" class="step">Cancel common factors</text>
  <path d="M970 375 V390" class="connector"/>
  <rect x="815" y="390" width="310" height="45" class="step-box"/>
  <text x="970" y="418" text-anchor="middle" class="step">Reduced ratio: 3/4</text>
  <path d="M970 435 C965 465 930 485 900 500" class="success"/>

  <rect x="1180" y="190" width="340" height="50" class="method-box"/>
  <text x="1350" y="221" text-anchor="middle" class="method">M4 · Step-by-Step Reduction</text>
  <rect x="1195" y="260" width="310" height="38" class="step-box"/>
  <text x="1350" y="284" text-anchor="middle" class="step">72:96 → 36:48</text>
  <path d="M1350 298 V305" class="connector"/>
  <rect x="1195" y="305" width="310" height="38" class="step-box"/>
  <text x="1350" y="329" text-anchor="middle" class="step">36:48 → 18:24</text>
  <path d="M1350 343 V350" class="connector"/>
  <rect x="1195" y="350" width="310" height="38" class="step-box"/>
  <text x="1350" y="374" text-anchor="middle" class="step">18:24 → 9:12</text>
  <path d="M1350 388 V395" class="connector"/>
  <rect x="1195" y="395" width="310" height="38" class="step-box"/>
  <text x="1350" y="419" text-anchor="middle" class="step">9:12 → 3:4</text>
  <path d="M1350 433 C1285 470 1160 500 1100 530" class="success"/>

  <rect x="500" y="500" width="600" height="70" class="shared-box"/>
  <text x="800" y="529" text-anchor="middle" class="method">SHARED COMPARISON</text>
  <text x="800" y="551" text-anchor="middle" class="detail">Does the result match the original ratio 3:4?</text>
  <path d="M800 570 V610 H20 V1080 H800 V1160" class="success"/>

  <!-- Remaining methods, ordered M5-M8 -->
  <rect x="40" y="770" width="340" height="50" class="method-box"/>
  <text x="210" y="801" text-anchor="middle" class="method">M5 · Cross Multiplication</text>
  <rect x="55" y="840" width="310" height="42" class="step-box"/>
  <text x="210" y="866" text-anchor="middle" class="step">Set up 3×96 and 4×72</text>
  <rect x="55" y="895" width="145" height="42" class="step-box"/>
  <text x="127" y="921" text-anchor="middle" class="step">3×96 = 288</text>
  <rect x="220" y="895" width="145" height="42" class="step-box"/>
  <text x="292" y="921" text-anchor="middle" class="step">4×72 = 288</text>
  <path d="M127 937 L210 950 M292 937 L210 950" class="connector"/>
  <rect x="55" y="950" width="310" height="42" class="step-box"/>
  <text x="210" y="976" text-anchor="middle" class="step">Compare the products</text>
  <path d="M210 992 V1080" class="success"/>

  <rect x="420" y="770" width="340" height="50" class="method-box"/>
  <text x="590" y="801" text-anchor="middle" class="method">M6 · Scaling</text>
  <rect x="435" y="840" width="310" height="42" class="step-box"/>
  <text x="590" y="866" text-anchor="middle" class="step">Find scale factor: 24</text>
  <path d="M590 882 V895" class="connector"/>
  <rect x="435" y="895" width="310" height="42" class="step-box"/>
  <text x="590" y="921" text-anchor="middle" class="step">Verify 4×24 = 96</text>
  <path d="M590 937 V950" class="connector"/>
  <rect x="435" y="950" width="310" height="42" class="step-box"/>
  <text x="590" y="976" text-anchor="middle" class="step">Both terms scale by 24</text>
  <path d="M590 992 V1080" class="success"/>

  <rect x="800" y="770" width="340" height="50" class="method-box"/>
  <text x="970" y="801" text-anchor="middle" class="method">M7 · Decimal Comparison</text>
  <rect x="815" y="840" width="145" height="42" class="step-box"/>
  <text x="887" y="866" text-anchor="middle" class="step">3÷4 = 0.75</text>
  <rect x="980" y="840" width="145" height="42" class="step-box"/>
  <text x="1052" y="866" text-anchor="middle" class="step">72÷96 = 0.75</text>
  <path d="M887 882 L970 900 M1052 882 L970 900" class="connector"/>
  <rect x="815" y="900" width="310" height="42" class="step-box"/>
  <text x="970" y="926" text-anchor="middle" class="step">Compare decimal values</text>
  <path d="M970 942 V1080" class="success"/>

  <rect x="1180" y="770" width="340" height="50" class="method-box"/>
  <text x="1350" y="801" text-anchor="middle" class="method">M8 · Equivalent Fraction</text>
  <rect x="1195" y="840" width="310" height="42" class="step-box"/>
  <text x="1350" y="866" text-anchor="middle" class="step">Multiply 3:4 by 24</text>
  <path d="M1350 882 V895" class="connector"/>
  <rect x="1195" y="895" width="310" height="42" class="step-box"/>
  <text x="1350" y="921" text-anchor="middle" class="step">Get 72:96</text>
  <path d="M1350 937 V950" class="connector"/>
  <rect x="1195" y="950" width="310" height="42" class="step-box"/>
  <text x="1350" y="976" text-anchor="middle" class="step">Recognize equivalent ratios</text>
  <path d="M1350 992 V1080" class="success"/>

  <path d="M210 1080 H1350 M800 1080 V1160" fill="none" stroke="#34d399" stroke-width="2.5"/>

  <rect x="600" y="1160" width="400" height="70" class="conclusion-box"/>
  <text x="800" y="1191" text-anchor="middle" class="method">CONCLUSION</text>
  <text x="800" y="1213" text-anchor="middle" class="detail">3:4 and 72:96 are proportional</text>
  <text x="800" y="1255" text-anchor="middle" class="detail">8 methods · 35 nodes · 44 edges</text>
</svg>